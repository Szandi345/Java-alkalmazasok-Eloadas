<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Historikus devizaárfolyamok</title>
    <link rel="stylesheet" th:href="@{/style/main.css}">
    <style>
        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
        }
        .chart-container canvas {
            max-width: 100%;
        }
        .history-table {
            overflow-x: auto;
        }
    </style>
</head>
<body class="is-preload">
<div id="wrapper">
    <div id="main">
        <div class="inner">
            <header id="header">
                <a th:href="@{/}" class="logo">
                    <strong>Forex és MNB</strong> Dashboard
                </a>
            </header>
            <section>
                <!-- Historikus árfolyamok táblázata -->
                <header class="major">
                    <h2>Utolsó 10 historikus árfolyam</h2>
                </header>
                <div class="table-wrapper">
                    <table>
                        <thead>
                        <tr>
                            <th>Időpont (UTC)</th>
                            <th>Nyitóár</th>
                            <th>Maximum</th>
                            <th>Minimum</th>
                            <th>Záróár</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="row : ${history}">
                            <td th:text="${row.time}"></td>
                            <td th:text="${row.open}"></td>
                            <td th:text="${row.high}"></td>
                            <td th:text="${row.low}"></td>
                            <td th:text="${row.close}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</div>
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
