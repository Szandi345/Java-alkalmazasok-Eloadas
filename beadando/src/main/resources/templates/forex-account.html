<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Forex – Számlainformációk</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style/main.css}">
</head>
<body>

<!-- Navigáció -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h1 class="fw-bold">Számlainformációk</h1>
            <p class="text-muted">
                OANDA Practice kereskedési számla
            </p>
        </div>
        <a href="/forex/account"
           class="btn btn-primary">
            Adatok frissítése
        </a>
    </div>

    <!-- Hibaüzenet -->
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <!-- Számlaadatok -->
    <div th:if="${error == null}">
        <div class="row g-4">
            <!-- Egyenleg -->
            <div class="col-md-6 col-lg-3">
                <div class="card info-card h-100 p-4">
                    <div class="card-label">
                        Számlaegyenleg
                    </div>
                    <div class="card-value"
                         th:text="${balance} + ' ' + ${currency}">
                    </div>
                </div>
            </div>

            <!-- Pénznem -->
            <div class="col-md-6 col-lg-3">
                <div class="card info-card h-100 p-4">
                    <div class="card-label">
                        Pénznem
                    </div>
                    <div class="card-value"
                         th:text="${currency}">
                    </div>
                </div>
            </div>

            <!-- Nyitott trade-ek -->
            <div class="col-md-6 col-lg-3">
                <div class="card info-card h-100 p-4">
                    <div class="card-label">
                        Nyitott trade-ek
                    </div>
                    <div class="card-value"
                         th:text="${openTradeCount}">
                    </div>
                </div>
            </div>

            <!-- Számla neve -->
            <div class="col-md-6 col-lg-3">
                <div class="card info-card h-100 p-4">
                    <div class="card-label">
                        Számla neve
                    </div>
                    <div class="card-value"
                         th:text="${alias}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Részletes adatok -->
        <div class="card info-card mt-4 p-4">

            <h4 class="mb-4">
                Részletes számlaadatok
            </h4>

            <div class="table-responsive">
                <table class="table table-striped">
                    <tbody>
                    <tr>
                        <th>Számlaazonosító</th>
                        <td th:text="${accountId}"></td>
                    </tr>
                    <tr>
                        <th>Nettó eszközérték (NAV)</th>
                        <td th:text="${nav} + ' ' + ${currency}">
                        </td>
                    </tr>
                    <tr>
                        <th>Szabad fedezet</th>
                        <td th:text="${marginAvailable} + ' ' + ${currency}">
                        </td>
                    </tr>
                    <tr>
                        <th>Nem realizált eredmény</th>
                        <td th:text="${unrealizedPL} + ' ' + ${currency}">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer id="footer">
    <p class="copyright"><a>Készítette: <br> Laucsik Dominik (DILLSZ) <br> Sztroka Alexandra Laura (G34R4F)</a>.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
