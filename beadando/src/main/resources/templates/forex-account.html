<!DOCTYPE html>
<html lang="hu"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Forex – Számlainformációk</title>

    <!-- Eredeti piros Editorial CSS -->
    <link rel="stylesheet" th:href="@{/style/main.css}">
</head>
<body class="is-preload">
<div id="wrapper">

    <!-- Fő tartalom -->
    <div id="main">
        <div class="inner">

            <!-- Fejléc -->
            <header id="header">
                <a th:href="@{/}" class="logo">
                    <strong>Forex és MNB</strong> Dashboard
                </a>
            </header>

            <!-- Oldal címe -->
            <section>
                <header class="main">
                    <h1>Számlainformációk</h1>
                </header>
                <p>
                    OANDA Practice kereskedési számla
                    aktuális adatai.
                </p>

                <ul class="actions refresh-button">
                    <li>
                        <a th:href="@{/forex/account}"
                           class="button primary">
                            Adatok frissítése
                        </a>
                    </li>
                </ul>

                <!-- Hibaüzenet -->
                <div th:if="${error}"
                     class="error-message"
                     th:text="${error}">
                </div>

                <!-- Számlaadatok -->
                <div th:if="${error == null}">
                    <header class="major">
                        <h2>Számla áttekintése</h2>
                    </header>
                    <div class="row gtr-150">

                        <!-- Számlaegyenleg -->
                        <div class="col-6 col-12-small">
                            <div class="account-card">
                                <div class="account-label">
                                    Számlaegyenleg
                                </div>
                                <div class="account-value"
                                     th:text="|${balance} ${currency}|">
                                </div>
                            </div>
                        </div>

                        <!-- Pénznem -->
                        <div class="col-6 col-12-small">
                            <div class="account-card">
                                <div class="account-label">
                                    Pénznem
                                </div>
                                <div class="account-value"
                                     th:text="${currency}">
                                </div>
                            </div>
                        </div>

                        <!-- Nyitott pozíciók -->
                        <div class="col-6 col-12-small">
                            <div class="account-card">
                                <div class="account-label">
                                    Nyitott trade-ek
                                </div>
                                <div class="account-value"
                                     th:text="${openTradeCount}">
                                </div>
                            </div>
                        </div>

                        <!-- Számla neve -->
                        <div class="col-6 col-12-small">
                            <div class="account-card">
                                <div class="account-label">
                                    Számla neve
                                </div>
                                <div class="account-value"
                                     th:text="${alias}">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Részletes adatok -->
                    <div class="account-details">
                        <header class="major">
                            <h2>Részletes számlaadatok</h2>
                        </header>
                        <div class="table-wrapper">
                            <table>
                                <tbody>
                                <tr>
                                    <th>Számlaazonosító</th>
                                    <td th:text="${accountId}"></td>
                                </tr>
                                <tr>
                                    <th>
                                        Nettó eszközérték (NAV)
                                    </th>
                                    <td th:text="|${nav} ${currency}|">
                                    </td>
                                </tr>
                                <tr>
                                    <th>Szabad fedezet</th>
                                    <td th:text="|${marginAvailable} ${currency}|">
                                    </td>
                                </tr>
                                <tr>
                                    <th>Nem realizált eredmény</th>
                                    <td th:text="|${unrealizedPL} ${currency}|">
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Közös Editorial navigáció -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</div>

<!-- Közös navigáció működése -->
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
