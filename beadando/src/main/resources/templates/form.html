<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SOAP kliens</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/style/main.css" />
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

    <!-- Main -->
    <div id="main">
        <div class="inner">

            <!-- Header -->
            <header id="header">
                <a href="" class="logo">SOAP kliens</a>
                <!--                <ul class="icons">-->
                <!--                    <li><a href="#" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li>-->
                <!--                    <li><a href="#" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>-->
                <!--                    <li><a href="#" class="icon brands fa-snapchat-ghost"><span class="label">Snapchat</span></a></li>-->
                <!--                    <li><a href="#" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>-->
                <!--                    <li><a href="#" class="icon brands fa-medium-m"><span class="label">Medium</span></a></li>-->
                <!--                </ul>-->
            </header>

            <!-- Banner -->
            <section id="banner">
                <div class="content">
                    <form action="#" th:action="@{/exercise}" th:object="${param}" method="post">
                        <select name="currencies" th:field="*{currency}">
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                            <option value="GBP">GBP</option>
                            <option value="JPY">JPY</option>
                        </select><br>
                        Kezdő dátum: <input type="date" th:field="*{startDate}"><br>
                        Befejező dátum: <input type="date" th:field="*{endDate}"><br>
                        <input type="submit" value="Küldés">
                    </form>
                </div>
            </section>
        </div>
    </div>

    <!-- Közös Editorial navigáció -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</div>

<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
